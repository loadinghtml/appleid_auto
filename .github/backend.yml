name: Build and Push Backend (Multi-Arch)

on:
  workflow_dispatch:  # 允许手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: backend        # ⚠️ 指定拉取 backend 分支
          
      # 2. 设置 QEMU (这对构建 ARM 镜像至关重要)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      # 3. 设置 Docker Buildx (构建多架构镜像的核心工具)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # ⚠️ 关键点：指定上下文目录为 backend 文件夹
          context: ./backend
          file: ./backend/Dockerfile
          # 指定多架构
          platforms: linux/amd64,linux/arm64
          # 推送到 Docker Hub (改为你自己的镜像名)
          tags: |
            loadinghtml/appleauto_backend:latest
            loadinghtml/appleauto_backend:${{ github.run_number }}
          push: true

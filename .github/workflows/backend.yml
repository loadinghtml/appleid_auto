name: Build Backend (Multi-Arch)

# 1. 触发方式：手动触发
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 2. 检出代码
      # ⚠️ 关键：强制拉取 'backend' 分支，因为你的代码不在 main 分支
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: backend

      # 3. 设置 QEMU (编译 ARM64 必须)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. 设置构建工具 Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 登录 Docker Hub
      # (需要在仓库 Settings -> Secrets 里配置 DOCKER_USERNAME 和 DOCKER_PASSWORD)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # ⚠️ 核心配置：根据你提供的链接，代码在 backend 目录下
          context: ./backend
          # 指定 Dockerfile 文件的具体路径
          file: ./backend/Dockerfile
          # 同时构建 AMD 和 ARM 架构
          platforms: linux/amd64,linux/arm64
          # 构建完成后推送到 Docker Hub
          push: true
          # 镜像标签 (我保留了你之前用的名字，如有变化请修改这里)
          tags: |
            loadinghtml/appleauto_backend:latest
